services:
  app:
    build: ./laravel
    container_name: petshelter-app
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: petShelter
      DB_USERNAME: petshelter
      DB_PASSWORD: petshelter
    volumes:
      - photos:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: petshelter-db
    environment:
      MYSQL_DATABASE: petShelter
      MYSQL_USER: petshelter
      MYSQL_PASSWORD: petshelter
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    container_name: petshelter-pma
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db-data:
  photos:
